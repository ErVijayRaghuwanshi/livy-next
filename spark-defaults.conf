# ==============================================================================
# Apache Spark Connect Server Configuration
# Reference: Apache Spark 4.1.2 / 4.2.0 Architecture, Session Management & Lifecycle
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Spark Connect Session Lifecycle Management
# ------------------------------------------------------------------------------
# Inactive session timeout: session is removed if no incoming RPCs are received for 60m.
# In a multi-user environment (e.g. Jupyter, Airflow), prevents abandoned sessions from accumulating.
spark.connect.session.manager.defaultSessionTimeout   60m

# Maintenance interval: frequency of the background reaper checking for expired sessions.
spark.connect.session.manager.maintenanceInterval     30s

# ------------------------------------------------------------------------------
# 2. Execution & Detached Operation Lifecycle
# ------------------------------------------------------------------------------
# Detached execution timeout: clean up executions whose client RPC disconnected after 5m.
spark.connect.execute.manager.detachedTimeout         5m

# Maintenance interval for cleaning up detached executions.
spark.connect.execute.manager.maintenanceInterval     30s

# ------------------------------------------------------------------------------
# 3. Result Transport & Large Data Transfer
# ------------------------------------------------------------------------------
# Maximum result chunk size when transferring Arrow batches over gRPC.
# Helps avoid single giant gRPC frames for large DataFrame collections.
spark.connect.session.resultChunking.maxChunkSize     16m

# General network timeout for driver/executor communication
spark.network.timeout                                 120s

# ------------------------------------------------------------------------------
# 4. Spark Connect UI & History Retention Limits
# ------------------------------------------------------------------------------
# Number of client sessions retained in the Spark Connect UI history (/connect/).
spark.sql.connect.ui.retainedSessions                 200

# Number of statements retained per session in the Connect UI history.
spark.sql.connect.ui.retainedStatements               200

# ------------------------------------------------------------------------------
# 5. External Extensions and Event Logging
# ------------------------------------------------------------------------------
# Kafka, Avro, Sedona, and PostgreSQL JDBC jars are pre-installed into /opt/spark/jars
# during the Docker build for instant (<3s) container startup without runtime Ivy downloads.

# Enable Apache Sedona SQL Extensions
spark.sql.extensions             org.apache.sedona.sql.SedonaSqlExtensions

# Enable Event Logging for Spark History Server
spark.eventLog.enabled           true
spark.eventLog.dir               file:/opt/spark/event_logs
