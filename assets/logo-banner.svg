<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 90" width="900" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="banBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Primary Logo Gradient -->
    <linearGradient id="banP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="banS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="banF" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="nextWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="banGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="446" height="86" rx="14" fill="url(#banBg)" stroke="url(#banBorder)" stroke-width="1.2"/>

  <!-- Logo Mark (scaled down to 70x70, positioned at x=12, y=10) -->
  <g transform="translate(12, 10) scale(0.7)">
    <rect x="4" y="4" width="92" height="92" rx="24" fill="#090d1a" stroke="url(#banBorder)" stroke-width="2"/>
    <g opacity="0.35" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="2 3">
      <line x1="20" y1="28" x2="42" y2="20"/>
      <line x1="80" y1="30" x2="55" y2="46"/>
      <line x1="24" y1="76" x2="48" y2="62"/>
      <line x1="76" y1="74" x2="56" y2="54"/>
    </g>
    <circle cx="20" cy="28" r="3" fill="#38bdf8" opacity="0.85"/>
    <circle cx="80" cy="30" r="3" fill="#fb923c" opacity="0.85"/>
    <circle cx="24" cy="76" r="2.5" fill="#818cf8" opacity="0.75"/>
    <circle cx="76" cy="74" r="3" fill="#f43f5e" opacity="0.85"/>
    <path d="M26 20 C26 17.8 27.8 16 30 16 L36 16 C38.2 16 40 17.8 40 20 L40 62 C40 63.1 40.9 64 42 64 L64 64 C66.2 64 68 65.8 68 68 L68 72 C68 74.2 66.2 76 64 76 L30 76 C27.8 76 26 74.2 26 72 Z" fill="url(#banP)" filter="url(#banGlow)"/>
    <path d="M52 24 C50.5 22.5 50.5 20 52 18.5 L55 15.5 C56.5 14 59 14 60.5 15.5 L79 34 C80.5 35.5 80.5 38 79 39.5 L60.5 58 C59 59.5 56.5 59.5 55 58 L52 55 C50.5 53.5 50.5 51 52 49.5 L65 36.8 Z" fill="url(#banS)" filter="url(#banGlow)"/>
    <g filter="url(#banGlow)">
      <path d="M50 36 L43 50 L51 50 L45 66 L59 48 L49 48 Z" fill="url(#banF)"/>
      <circle cx="49" cy="49" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography: LIVY-NEXT -->
  <text x="96" y="46" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">
    LIVY<tspan fill="url(#nextWordGrad)">-NEXT</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="97" y="65" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="0.8" fill="#94a3b8" text-rendering="geometricPrecision">
    CLOUD-NATIVE GO GATEWAY &#8226; APACHE SPARK 4.x CONNECT
  </text>

  <!-- Status Pulse Dot -->
  <circle cx="424" cy="24" r="4" fill="#10b981"/>
  <circle cx="424" cy="24" r="7" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
</svg>
